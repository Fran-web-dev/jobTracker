[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://cutlet-infinite-cow.abasthan.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://cutlet-infinite-cow.abasthan.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://cutlet-infinite-cow.abasthan.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
